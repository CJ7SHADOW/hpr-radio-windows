name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        run: |
          $v = ([xml](Get-Content src/HprRadio/HprRadio.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Version $v"

      - name: Build
        run: dotnet publish src/HprRadio/HprRadio.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish

      # Plays the real HPR streams silently, loads song histories, cover art and Good 'N Country,
      # takes screenshots. Network hiccups on HPR's side don't fail the build, a crash does.
      - name: Self-test against the live HPR services
        run: |
          $p = Start-Process -FilePath publish\HprRadio.exe -ArgumentList '--selftest', "$PWD\selftest" -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process $p -Force; Write-Host "::warning::self-test timed out" }
          Get-Content selftest\live.log
          $log = Get-Content selftest\live.log -Raw
          if ($log -match 'UNHANDLED') { Write-Host "::error::the app hit an unhandled exception"; exit 1 }
          if ($log -notmatch 'SELFTEST DONE') { Write-Host "::error::the self-test didn't finish"; exit 1 }
          Get-Content selftest\live.log | Select-String -Pattern '^\[\s*[\d.]+\] (\[\d|recent|episodes|after|volume|playing|title|failure|retry)' |
            ForEach-Object { Write-Host "::notice::$($_.Line)" }

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DMyVersion=$env:VERSION" "/DSourceDir=$PWD\publish" installer\hpr-radio.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path publish\* -DestinationPath "out\HPR-Radio-$env:VERSION-portable.zip"
          Get-ChildItem out | ForEach-Object { Write-Host "::notice::$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: hpr-radio-windows
          path: out/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest/*

      # Same results on a branch (easier to look at than zipped artifacts).
      - name: Publish self-test results to the ci-results branch
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\results" | Out-Null
          Copy-Item selftest\* "$env:RUNNER_TEMP\results" -ErrorAction SilentlyContinue
          Set-Location "$env:RUNNER_TEMP\results"
          git init -q -b results
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "Self-test results for $($env:GITHUB_SHA.Substring(0,7))"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results:ci-results

      # A release for each new version number in HprRadio.csproj, on commits marked [release].
      - name: Publish a release (once per version)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$env:VERSION already released"; exit 0 }
          $notes = "Download **HPR-Radio-Setup-$env:VERSION.exe** below and run it. It installs just for you (no administrator needed) and adds HPR Radio to the Start menu.`n`nWindows may say *Windows protected your PC* the first time, because the app isn't signed with a paid certificate: click **More info**, then **Run anyway**.`n`nThe **portable** zip runs without installing: unzip it anywhere and start HprRadio.exe."
          gh release create "v$env:VERSION" out/* --target "$env:GITHUB_SHA" --title "HPR Radio $env:VERSION" --notes $notes
          exit 0
